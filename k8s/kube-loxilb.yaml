apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-loxilb
  namespace: kube-system
  labels:
    app: kube-loxilb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-loxilb
  template:
    metadata:
      labels:
        app: kube-loxilb
    spec:
      serviceAccountName: kube-loxilb
      containers:
        - name: kube-loxilb
          image: ghcr.io/loxilb-io/kube-loxilb:latest
          imagePullPolicy: Always
          command:
            - /bin/kube-loxilb
          args:
            - --loxiURL=http://127.0.0.1:11111
            - --externalCIDR=20.20.20.0/24
            - --setLBMode=2  # onearm mode
          resources:
            requests:
              cpu: 100m
              memory: 50Mi
            limits:
              cpu: 200m
              memory: 100Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-loxilb
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-loxilb
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "endpoints", "services", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-loxilb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-loxilb
subjects:
  - kind: ServiceAccount
    name: kube-loxilb
    namespace: kube-system
